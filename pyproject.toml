[project]
name = "dynamic-tuning"
version = "0.1.0"
description = "Render symbolic music with arbitrary tuning and timbre, measure and control its dissonance."
readme = "README.md"
license = "MIT"
authors = [{ name = "Bohumir Zamecnik", email = "bohumir.zamecnik@gmail.com" }]
requires-python = ">=3.13,<3.14"
dependencies = [
    "dissonant>=0.1.1",
    "matplotlib>=3.10",
    "music21>=9.1",
    "numpy>=2.0",
    "pretty-midi>=0.2.10",
    "scipy>=1.14",
    "soundfile>=0.12",
]

[dependency-groups]
dev = [
    "mypy>=1.13",
    "pytest>=8.3",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dynamic_tuning"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "NPY", "RUF"]

[tool.mypy]
python_version = "3.13"
files = ["src", "tests", "scripts"]
warn_unused_ignores = true
warn_redundant_casts = true
check_untyped_defs = true

[[tool.mypy.overrides]]
module = ["pretty_midi.*", "music21.*", "dissonant.*", "soundfile.*", "scipy.*", "mido.*"]
ignore_missing_imports = true
